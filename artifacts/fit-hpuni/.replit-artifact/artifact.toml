kind = "web"
previewPath = "/"
title = "FIT-HPUni · Đồng Điệu"
description = "Interactive FIT-HPUni faculty shirt showcase built from the approved Đồng Điệu canvas design. Explore navy and white shirts, select a size, and inspect enlarged garment and print details."
version = "1.0.0"
id = "artifacts/fit-hpuni"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24385

[services.development]
run = "pnpm --filter @workspace/fit-hpuni run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fit-hpuni", "run", "build" ]
serve = "static"
publicDir = "artifacts/fit-hpuni/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24385"
BASE_PATH = "/"
